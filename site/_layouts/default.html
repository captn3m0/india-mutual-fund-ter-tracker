<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/sakura.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/sakura-dark.css' | relative_url }}" media="(prefers-color-scheme: dark)">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }} (RSS)" href="{{ '/feed.xml' | absolute_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }} (Atom)" href="{{ '/atom.xml' | absolute_url }}">
  <link rel="alternate" type="application/feed+json" title="{{ site.title }} (JSON Feed)" href="{{ '/feed.json' | absolute_url }}">
  <style>.lowered { color: #2e7d32; } .increased { color: #c62828; } li { margin-bottom: 0.25em; }</style>
</head>
<body>
  <header>
    <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
    <p>{{ site.description }}</p>
  </header>
  <main>
{{ content }}
  </main>
  <footer>
    <hr>
    <p>Data from <a href="https://www.amfiindia.com/ter-of-mf-schemes">AMFI</a>. Source on <a href="https://github.com/{{ site.repository }}">GitHub</a>.</p>
  </footer>
</body>
</html>
